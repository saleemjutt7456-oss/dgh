name: Daily gaming videos

# Two runs a day: each one finds a topic, makes a video and uploads it.
on:
  schedule:
    - cron: "0 6 * * *"    # 11:00 Pakistan time
    - cron: "0 14 * * *"   # 19:00 Pakistan time
  workflow_dispatch:
    inputs:
      count:
        description: "Videos to create and upload in this run"
        default: "1"
      dry_run:
        description: "1 = create videos but do not upload"
        default: "0"

permissions:
  contents: write

concurrency:
  group: youtube-upload
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Find topic and create video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python generate.py --count "${{ github.event.inputs.count || '1' }}"

      - name: Upload to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          MAX_UPLOADS: ${{ github.event.inputs.count || '1' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python upload.py

      - name: Save history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data uploaded queue
          if ! git diff --cached --quiet; then
            git commit -m "Update upload history"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
